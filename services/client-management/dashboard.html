<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PakarController · Clients</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#10151c;color:#e5eaf1;--muted:#96a1b0;--line:#2a3442;--accent:#66b7ff}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;padding:20px 28px;border-bottom:1px solid var(--line)}h1{font-size:18px;font-weight:600;margin:0}header small{color:var(--muted)}main{max-width:1200px;margin:auto;padding:24px}form,.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:10px;margin-bottom:20px}label{display:grid;gap:6px;color:var(--muted);font-size:12px}input,select,button{font:inherit;background:#1b2430;color:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 12px;min-height:38px}input{min-width:240px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.danger{color:#ff9c9c}.muted{color:var(--muted)}.panel{background:#151d27;border:1px solid var(--line);border-radius:10px;overflow:auto;margin-bottom:24px}.panel h2{font-size:14px;margin:0;padding:16px;border-bottom:1px solid var(--line)}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #242d39;white-space:nowrap}th{font-weight:500;color:var(--muted);font-size:12px}td button{padding:5px 8px;min-height:30px;margin-right:5px}tr.offline{color:var(--muted)}.tag{font-size:12px;padding:3px 7px;border-radius:4px;background:#203b34;color:#91dbc0}.offline .tag{background:#2a3039;color:var(--muted)}#message{min-height:24px;color:var(--muted)}code{font-family:ui-monospace,monospace;font-size:12px}#tokenResult{max-width:100%;overflow-wrap:anywhere;user-select:all;padding:10px 0}
</style>
<header><img src="./icon.png" alt="" width="28" height="28"><h1>PakarController</h1><small>Client management</small></header>
<main><form id="login"><label>Administrator token<input id="token" type="password" autocomplete="off" required></label><button>Connect</button><button type="button" id="disconnect">Disconnect</button></form>
<p id="message" role="status">Connect to view enrolled clients.</p>
<section class="panel"><h2>Clients</h2><table><thead><tr><th>Device</th><th>Platform</th><th>Version</th><th>Status</th><th>Last seen</th><th>Actions</th></tr></thead><tbody id="clients"></tbody></table></section>
<section class="panel"><h2>Management history</h2><table><thead><tr><th>Client</th><th>Action</th><th>State</th><th>Detail</th></tr></thead><tbody id="commands"></tbody></table></section>
<div class="toolbar"><label>New enrollment<select id="platform"><option value="windows-x64">Windows</option><option value="android">Android</option></select></label><button id="enroll">Create one-use token</button><button id="cleanup">Clean obsolete server packages</button></div><div id="tokenResult"></div>
<p class="muted">Latest three releases per platform are retained. Client removal is available only when that client explicitly enables it.</p></main>
<script>
let token='',timer=null;const $=id=>document.getElementById(id),base=location.pathname.replace(/\/$/,'');
async function api(path,data){const r=await fetch(base+path,{method:data===undefined?'GET':'POST',cache:'no-store',headers:{Authorization:'Bearer '+token,...(data===undefined?{}:{'Content-Type':'application/json'})},body:data===undefined?undefined:JSON.stringify(data),signal:AbortSignal.timeout(10000)});let v;try{v=await r.json()}catch{throw Error('Invalid service response')}if(!r.ok)throw Error(v.error||'Request rejected');return v}
const cell=(row,value)=>{const td=document.createElement('td');td.textContent=value??'—';row.appendChild(td);return td};
async function action(id,value){if(value==='uninstall'&&!confirm('Request removal of PakarController from this enrolled client? Its local policy and OS consent still apply.'))return;await api('/api/admin/clients/'+id+'/commands',{action:value,...(value==='uninstall'?{confirmation:'uninstall PakarController'}:{})});$('message').textContent='Action queued; awaiting the client receipt.';await refresh()}
function safely(fn){return()=>Promise.resolve().then(fn).catch(e=>$('message').textContent=e.message)}
async function refresh(){if(!token)return;const [a,b]=await Promise.all([api('/api/admin/clients'),api('/api/admin/commands')]);$('clients').replaceChildren();for(const c of a.clients){const r=document.createElement('tr');r.classList.toggle('offline',!c.online);cell(r,c.telemetry.hostname||c.id);cell(r,c.platform);cell(r,(c.telemetry.version||'Unknown')+' · '+(c.telemetry.build??'?'));const s=cell(r,'');const badge=document.createElement('span');badge.className='tag';badge.textContent=c.revoked?'Revoked':c.online?(c.telemetry.update_state||'Online'):'Offline';s.appendChild(badge);cell(r,new Date(c.last_seen).toLocaleString());const td=cell(r,'');for(const [name,command]of [['Check update','check-update'],['Clean packages','cleanup'],['Uninstall','uninstall']]){if(command==='uninstall'&&c.telemetry.allow_remote_uninstall!==true)continue;const btn=document.createElement('button');btn.textContent=name;btn.disabled=!c.online||!!c.revoked;if(command==='uninstall')btn.className='danger';btn.onclick=safely(()=>action(c.id,command));td.appendChild(btn)}$('clients').appendChild(r)}$('commands').replaceChildren();for(const c of b.commands){const r=document.createElement('tr');cell(r,c.client);cell(r,c.action);cell(r,c.result?.state||(c.claimed?'Claimed; outcome pending':c.expires<Date.now()?'Expired':'Queued'));cell(r,c.result?.detail||'');$('commands').appendChild(r)}}
$('login').onsubmit=e=>{e.preventDefault();token=$('token').value;$('token').value='';clearInterval(timer);safely(async()=>{await refresh();$('message').textContent='Connected';timer=setInterval(safely(refresh),10000)})()};
$('disconnect').onclick=()=>{clearInterval(timer);token='';$('clients').replaceChildren();$('commands').replaceChildren();$('tokenResult').textContent='';$('message').textContent='Disconnected'};
$('enroll').onclick=safely(async()=>{const r=await api('/api/admin/enrollments',{platform:$('platform').value});$('tokenResult').textContent=r.enrollment_token;$('message').textContent='One-use enrollment token; expires in10minutes.'});
$('cleanup').onclick=safely(async()=>{const r=await api('/api/admin/cleanup',{});$('message').textContent=r.removed+' obsolete packages removed; latest releases retained.'});
</script></html>
