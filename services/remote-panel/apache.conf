# PakarController managed private remote panel. No device LAN port exposure.
<VirtualHost *:80>
    ServerName ledboard.digitalogic.ir
    Redirect permanent / https://ledboard.digitalogic.ir/
</VirtualHost>
<VirtualHost *:443>
    ServerName ledboard.digitalogic.ir
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/digitalogic.ir/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/digitalogic.ir/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyRequests Off
    ProxyPass "/ws" "ws://127.0.0.1:18744/ws" retry=0 timeout=60
    ProxyPassReverse "/ws" "ws://127.0.0.1:18744/ws"
    ProxyPass "/" "http://127.0.0.1:18744/" retry=0 timeout=30
    ProxyPassReverse "/" "http://127.0.0.1:18744/"
    ErrorLog ${APACHE_LOG_DIR}/pakarcontroller-remote-panel-error.log
    CustomLog ${APACHE_LOG_DIR}/pakarcontroller-remote-panel-access.log combined
</VirtualHost>
