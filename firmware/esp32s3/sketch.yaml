profiles:
  s3:
    notes: Integrated shared PakarController; confirm flash and PSRAM before deployment
    fqbn: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=default_8MB,CDCOnBoot=cdc,USBMode=hwcdc
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - FastLED (3.10.6)
      - WebSockets (2.7.2)
      - PubSubClient (2.8.0)
      - ArduinoJson (7.4.3)
      - ESP Async WebServer (3.12.1)
      - Async TCP (3.5.0)
      - dir: ../../libraries/BoardCore
