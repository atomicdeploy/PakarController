name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install locked board platforms and libraries
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done
            return 1
          }
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli config add board_manager.additional_urls https://mcudude.github.io/MiniCore/package_MCUdude_MiniCore_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install esp8266:esp8266@3.1.2
          retry arduino-cli core install MiniCore:avr@3.1.3
          retry arduino-cli lib install FastLED@3.10.6
          retry arduino-cli lib install WebSockets@2.7.2
          retry arduino-cli lib install PubSubClient@2.8.0
          retry arduino-cli lib install 'ESP Async WebServer@3.12.1'
          retry arduino-cli lib install 'ESP Async TCP@2.0.0'
      - name: Build both boards and test the shared protocol
        run: |
          chmod +x build.sh tools/test-protocol.sh
          ./build.sh polling
          ./build.sh busy-wire
          ./tools/test-protocol.sh
      - uses: actions/upload-artifact@v7
        with:
          name: PakarController-firmware
          if-no-files-found: error
          path: |
            build/avr/avr.ino.with_bootloader.bin
            build/avr/avr.ino.hex
            build/esp8266/esp8266.ino.bin
            build/SHA256SUMS
            build/avr-busy-wire/avr.ino.with_bootloader.bin
            build/avr-busy-wire/avr.ino.hex
            build/esp8266-busy-wire/esp8266.ino.bin
            build/SHA256SUMS-busy-wire

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build the mpv-free Windows client
        run: |
          node tests/web_display_test.mjs
          node tests/web_access_test.mjs
          node tests/boot_audio_test.mjs
          pwsh -File tools/check-reuse-ledger.ps1
          pwsh -File tests/reuse_ledger_test.ps1
          pwsh -File tools/verify-versions.ps1
          cargo test --locked --manifest-path desktop/Cargo.toml
          cargo build --locked --release --manifest-path desktop/Cargo.toml
          node tests/device_cli_test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: PakarController-Windows
          if-no-files-found: error
          path: desktop/target/release/pakarcontroller.exe

  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
      - name: Analyze and test mobile contracts
        working-directory: mobile
        env:
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build preview APK (not production signing)
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: PakarController-Android-preview
          if-no-files-found: error
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
