# Adapted from Pealayer CI/CD (MIT); see docs/licenses/Pealayer-MIT.txt.
name: "🚀 Build · Test · Release"
run-name: "🚀 PakarController · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build an owner-reviewed draft prerelease
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    name: "🛡️ Workflow syntax"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version: '1.25.x'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: git diff --check HEAD^ HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node tests/release_package_test.mjs
  quality:
    name: "🧭 Contracts · Repository health"
    needs: [lint, tooling]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      - name: Install pinned host-test headers only (no board SDKs)
        shell: pwsh
        run: |
          $taskPins = Get-Content tools/firmware-dependencies.json -Raw | ConvertFrom-Json
          $taskJson = @($taskPins.libraries | Where-Object name -eq 'ArduinoJson')
          if ($taskJson.Count -ne 1 -or $taskJson[0].version -notmatch '^\d+\.\d+\.\d+$') { throw 'Missing exact ArduinoJson pin' }
          arduino-cli lib update-index
          if ($LASTEXITCODE -ne 0) { throw 'Host-test library index failed' }
          arduino-cli lib install ('ArduinoJson@' + $taskJson[0].version)
          if ($LASTEXITCODE -ne 0) { throw 'Pinned host-test headers failed' }
      - run: node tools/ci-checks.mjs quality
      - run: node tests/led_backend_integration_test.mjs
      - run: node tests/web_led_backend_test.mjs
  tooling:
    name: "🧰 Scripts · ${{ matrix.os }}"
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: CLI, dependency and artifact fixtures (no devices or SDK builds)
        run: node tests/script_tooling_test.mjs
      - name: Locked Internet panel relay and actual HTTP/WebSocket regressions
        run: |
          npm ci --prefix services/remote-panel --ignore-scripts --no-audit --no-fund
          node --test services/remote-panel/gateway.test.mjs
      - name: All PowerShell syntax and shared runner fixtures
        shell: pwsh
        run: ./tests/script_tooling_test.ps1
      - name: Guarded firmware, native and mobile command plans
        shell: pwsh
        run: |
          ./tools/build-firmware.ps1 -Target esp32s3 -Plan
          ./tools/build-desktop.ps1 -Plan
          ./tools/build-mobile.ps1 -Mode Analyze -Plan
          ./tools/build-all.ps1
  firmware:
    name: "🔧 ESP32-S3 + ESP8266 + AVR"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install locked board platforms and libraries
        run: node tools/firmware-dependencies.mjs --install
      - name: Build both boards and test the shared protocol
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev
          bash build.sh polling
          bash build.sh busy-wire
          bash build.sh buffered avr
          # Compile the optional RX-only SDK adapter, then restore the canonical
          # normal image in the SAME cache/output before any artifact upload.
          pwsh -NoProfile -File tools/build-firmware.ps1 -Target esp32s3 -LinkMode buffered -S3FlashMB 16 -S3Psram opi -S3LedGpio -S3LedRmtDma -PauseAvrLink -Jobs 2
          # Exercise the optional native W5500/LLDP input-hook linkage before
          # restoring the generic image in that same canonical cache.
          pwsh -NoProfile -File tools/build-firmware.ps1 -Target esp32s3 -LinkMode buffered -S3FlashMB 16 -S3Psram opi -S3LedGpio -S3LedRmtDma -S3Ethernet -Jobs 2
          bash build.sh buffered esp32s3 --s3-flash-mb 16 --s3-psram opi
          bash tools/test-protocol.sh
          bash tools/test-pc-flags.sh
          node tools/firmware-report.mjs --require --write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PakarController-firmware
          retention-days: 7
          if-no-files-found: error
          path: |
            build/avr/avr.ino.with_bootloader.bin
            build/avr/avr.ino.hex
            build/esp8266/esp8266.ino.bin
            build/SHA256SUMS
            build/avr-busy-wire/avr.ino.with_bootloader.bin
            build/avr-busy-wire/avr.ino.hex
            build/esp8266-busy-wire/esp8266.ino.bin
            build/firmware-report.json
            build/avr-buffered/avr.ino.with_bootloader.bin
            build/avr-buffered/avr.ino.hex
            build/esp32s3-buffered/esp32s3.ino.bin
            build/esp32s3-buffered/esp32s3.ino.merged.bin
            build/esp32s3-buffered/esp32s3.ino.partitions.bin
      - name: Firmware sizes and integrity summary
        if: success()
        run: node tools/firmware-report.mjs --require

  windows-desktop:
    name: "🪟 Windows · Test · Package"
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop -> target
      - name: Test and build the mpv-free Windows client
        env:
          # Actual Pealayer CI isolation/backtrace policy; no user config access.
          PAKAR_CONFIG_FILE: ${{ runner.temp }}/pakar-tests.json
          RUST_BACKTRACE: '1'
        run: node tools/ci-checks.mjs desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PakarController-Windows
          retention-days: 7
          if-no-files-found: error
          path: desktop/target/release/pakarcontroller.exe

  android-preview:
    name: "🤖 Android · Preview"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Check shared interface contract
        run: node tools/generate-interface-contract.mjs --check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.3'
      - name: Analyze and test mobile contracts
        working-directory: mobile
        env:
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build preview APK (not production signing)
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PakarController-Android-preview
          retention-days: 7
          if-no-files-found: error
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  release:
    name: "✨ Draft release · Attested packages"
    needs: [lint, quality, firmware, windows-desktop, android-preview]
    if: github.repository == 'atomicdeploy/PakarController' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: PakarController-firmware
          path: release-incoming/firmware
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: PakarController-Windows
          path: release-incoming/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: PakarController-Android-preview
          path: release-incoming/android
      - name: Package matched board pairs and source provenance
        env:
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; else
            version=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(/kVersion\[\]\s*=\s*"(\d+\.\d+\.\d+)"/.exec(readFileSync("libraries/BoardCore/src/BuildInfo.h","utf8"))[1])')
            tag="v$version-preview"
          fi
          existing=$(gh api --paginate "repos/$REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$existing" | grep -Fqx "$tag"; then
            echo 'Existing releases are immutable; select a new reviewed version.' >&2; exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          node tools/prepare-release.mjs release-incoming release-assets "$tag" "$SOURCE_SHA" "$REPOSITORY" "$RUN_URL"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
        # Abort on failed release enumeration, rather than treating it as absence.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*.*
      - name: Create draft prerelease; never flash hardware
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release-assets/*.* --title "PakarController $RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md --target "$GITHUB_SHA" --draft --prerelease

  complete:
    name: "🚦 PakarController · Complete"
    if: always()
    needs: [lint, tooling, quality, firmware, windows-desktop, android-preview, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TOOLING: ${{ needs.tooling.result }}
          QUALITY: ${{ needs.quality.result }}
          FIRMWARE: ${{ needs.firmware.result }}
          WINDOWS: ${{ needs.windows-desktop.result }}
          ANDROID: ${{ needs.android-preview.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          {
            echo '# PakarController build verification'; echo
            echo '| Stage | Result |'; echo '|---|---|'
            echo "| Workflow syntax | $LINT |"
            echo "| Windows / Linux / macOS script plans | $TOOLING |"
            echo "| Interface / donor contracts | $QUALITY |"
            echo "| ESP + AVR, both link modes | $FIRMWARE |"
            echo "| Windows | $WINDOWS |"
            echo "| Android preview | $ANDROID |"
            echo "| Draft release | $RELEASE |"
            echo; echo '> CI does not prove physical operation or deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$LINT" == success && "$TOOLING" == success && "$QUALITY" == success && "$FIRMWARE" == success && "$WINDOWS" == success && "$ANDROID" == success ]]
          [[ "$RELEASE" == success || "$RELEASE" == skipped ]]
