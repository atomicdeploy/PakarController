# Adapted from Pealayer CI/CD (MIT); see docs/licenses/Pealayer-MIT.txt.
name: "🚀 Build · Test · Release"
run-name: "🚀 PakarController · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build an owner-reviewed draft prerelease
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    name: "🛡️ Workflow syntax"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version: '1.25.x'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: git diff --check HEAD^ HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node tests/release_package_test.mjs
  quality:
    name: "🧭 Contracts · Repository health"
    needs: lint
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node tools/ci-checks.mjs quality
  firmware:
    name: "🔧 ESP + AVR · Both UART variants"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install locked board platforms and libraries
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done
            return 1
          }
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli config add board_manager.additional_urls https://mcudude.github.io/MiniCore/package_MCUdude_MiniCore_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install esp8266:esp8266@3.1.2
          retry arduino-cli core install MiniCore:avr@3.1.3
          retry arduino-cli lib install FastLED@3.10.6
          retry arduino-cli lib install WebSockets@2.7.2
          retry arduino-cli lib install PubSubClient@2.8.0
          retry arduino-cli lib install ArduinoJson@7.4.3
          retry arduino-cli lib install 'ESP Async WebServer@3.12.1'
          retry arduino-cli lib install 'ESP Async TCP@2.0.0'
      - name: Build both boards and test the shared protocol
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev
          chmod +x build.sh tools/test-protocol.sh
          ./build.sh polling
          ./build.sh busy-wire
          ./tools/test-protocol.sh
          bash tools/test-pc-flags.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PakarController-firmware
          retention-days: 7
          if-no-files-found: error
          path: |
            build/avr/avr.ino.with_bootloader.bin
            build/avr/avr.ino.hex
            build/esp8266/esp8266.ino.bin
            build/SHA256SUMS
            build/avr-busy-wire/avr.ino.with_bootloader.bin
            build/avr-busy-wire/avr.ino.hex
            build/esp8266-busy-wire/esp8266.ino.bin
            build/SHA256SUMS-busy-wire

  windows-desktop:
    name: "🪟 Windows · Test · Package"
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop -> target
      - name: Test and build the mpv-free Windows client
        env:
          # Actual Pealayer CI isolation/backtrace policy; no user config access.
          PAKAR_CONFIG_FILE: ${{ runner.temp }}/pakar-tests.json
          RUST_BACKTRACE: '1'
        run: node tools/ci-checks.mjs desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PakarController-Windows
          retention-days: 7
          if-no-files-found: error
          path: desktop/target/release/pakarcontroller.exe

  android-preview:
    name: "🤖 Android · Preview"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check shared interface contract
        run: node tools/generate-interface-contract.mjs --check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.3'
      - name: Analyze and test mobile contracts
        working-directory: mobile
        env:
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build preview APK (not production signing)
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PakarController-Android-preview
          retention-days: 7
          if-no-files-found: error
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  release:
    name: "✨ Draft release · Attested packages"
    needs: [lint, quality, firmware, windows-desktop, android-preview]
    if: github.repository == 'atomicdeploy/PakarController' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: PakarController-firmware
          path: release-incoming/firmware
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: PakarController-Windows
          path: release-incoming/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: PakarController-Android-preview
          path: release-incoming/android
      - name: Package matched board pairs and source provenance
        env:
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; else
            version=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(/kVersion\[\]\s*=\s*"(\d+\.\d+\.\d+)"/.exec(readFileSync("libraries/BoardCore/src/BuildInfo.h","utf8"))[1])')
            tag="v$version-preview"
          fi
          existing=$(gh api --paginate "repos/$REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$existing" | grep -Fqx "$tag"; then
            echo 'Existing releases are immutable; select a new reviewed version.' >&2; exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          node tools/prepare-release.mjs release-incoming release-assets "$tag" "$SOURCE_SHA" "$REPOSITORY" "$RUN_URL"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
        # Abort on failed release enumeration, rather than treating it as absence.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*.*
      - name: Create draft prerelease; never flash hardware
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release-assets/*.* --title "PakarController $RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md --target "$GITHUB_SHA" --draft --prerelease

  complete:
    name: "🚦 PakarController · Complete"
    if: always()
    needs: [lint, quality, firmware, windows-desktop, android-preview, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          QUALITY: ${{ needs.quality.result }}
          FIRMWARE: ${{ needs.firmware.result }}
          WINDOWS: ${{ needs.windows-desktop.result }}
          ANDROID: ${{ needs.android-preview.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          {
            echo '# PakarController build verification'; echo
            echo '| Stage | Result |'; echo '|---|---|'
            echo "| Workflow syntax | $LINT |"
            echo "| Interface / donor contracts | $QUALITY |"
            echo "| ESP + AVR, both link modes | $FIRMWARE |"
            echo "| Windows | $WINDOWS |"
            echo "| Android preview | $ANDROID |"
            echo "| Draft release | $RELEASE |"
            echo; echo '> CI does not prove physical operation or deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$LINT" == success && "$QUALITY" == success && "$FIRMWARE" == success && "$WINDOWS" == success && "$ANDROID" == success ]]
          [[ "$RELEASE" == success || "$RELEASE" == skipped ]]
