name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install locked board platforms and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli config add board_manager.additional_urls https://mcudude.github.io/MiniCore/package_MCUdude_MiniCore_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli core install MiniCore:avr@3.1.3
          arduino-cli lib install FastLED@3.10.6
      - name: Build both boards and test the shared protocol
        run: |
          chmod +x build.sh tools/test-protocol.sh
          ./build.sh
          ./tools/test-protocol.sh
      - uses: actions/upload-artifact@v7
        with:
          name: PakarController-firmware
          if-no-files-found: error
          path: |
            build/avr/avr.ino.with_bootloader.bin
            build/avr/avr.ino.hex
            build/esp8266/esp8266.ino.bin
            build/SHA256SUMS

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build the mpv-free Windows client
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml
          cargo build --locked --release --manifest-path desktop/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: PakarController-Windows
          if-no-files-found: error
          path: desktop/target/release/pakarcontroller.exe
