# Adapted from Pealayer .github/workflows/codeql.yml (MIT).
name: "🛡️ Security · CodeQL"
run-name: "🛡️ PakarController · ${{ github.ref_name }}"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '37 2 * * 4'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: "🔎 ${{ matrix.language }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
  complete:
    name: "🛡️ CodeQL · Complete"
    if: always()
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          {
            echo '## PakarController security analysis'
            echo "Actions and JavaScript result: $RESULT"
            echo 'Rust and AVR/ESP C++ are not covered by this CodeQL configuration. Physical safety is a separate gate.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
