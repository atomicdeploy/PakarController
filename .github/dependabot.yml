version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github_actions]
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
    labels: [dependencies, rust]
