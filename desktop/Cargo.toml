[package]
name = "pakarcontroller"
version = "0.1.0"
edition = "2024"
description = "Native PakarController control surface"
license = "MIT"
repository = "https://github.com/atomicdeploy/PakarController"

[dependencies]
eframe = { version = "0.36.2", features = ["glow", "persistence"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
strip = "symbols"
lto = "thin"
