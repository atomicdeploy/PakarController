<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" fill="none">
  <title>PakarController — illuminated control grid</title>
  <desc>A luminous emerald control pad with a white cell, active green cells and a circular button, on a deep teal application tile.</desc>
  <defs>
    <linearGradient id="surface" x1="76" y1="40" x2="438" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173F3B"/><stop offset=".52" stop-color="#092B2B"/><stop offset="1" stop-color="#071C25"/>
    </linearGradient>
    <linearGradient id="edge" x1="64" y1="32" x2="436" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BE7B1" stop-opacity=".7"/><stop offset=".45" stop-color="#3CD9A0" stop-opacity=".12"/><stop offset="1" stop-color="#0F4443"/>
    </linearGradient>
    <linearGradient id="white" x1="106" y1="94" x2="242" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C5EBDD"/>
    </linearGradient>
    <linearGradient id="green" x1="120" y1="238" x2="392" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EF2B8"/><stop offset=".5" stop-color="#35DE95"/><stop offset="1" stop-color="#0DA879"/>
